name: Sync merged ad module

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the generator and checked-in subscription
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Reproduce the committed subscription from recorded inputs
        run: |
          python3 scripts/merge_modules.py --from-manifest sources.json
          git diff --exit-code -- PersonalAds.sgmodule sources.json rules/
          test -z "$(git ls-files --others --exclude-standard -- rules/)"
      - name: Check current upstream and build candidate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python3 scripts/merge_modules.py
          python3 -m unittest discover -s scripts -p 'test_built_module.py' -v
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: checked-subscription
          path: |
            PersonalAds.sgmodule
            sources.json
            rules/
          if-no-files-found: error

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checked-subscription
      - name: Publish validated changes
        run: |
          git add -- PersonalAds.sgmodule sources.json rules/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync merged ad module from upstream"
          git push origin HEAD:main
